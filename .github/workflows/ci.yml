name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Install ArduinoJson for native tests
        run: |
          mkdir -p ~/Arduino/libraries
          git clone --branch 7.4.3 --depth 1 \
            https://github.com/bblanchon/ArduinoJson.git \
            ~/Arduino/libraries/ArduinoJson

      - name: Build and run native tests
        run: make test JSON_INC="$HOME/Arduino/libraries/ArduinoJson/src"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [native-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/

      - name: Install ESP8266 core
        run: |
          arduino-cli config set board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update
          arduino-cli core install esp8266:esp8266@3.1.2

      - name: Install Arduino libraries
        run: |
          arduino-cli lib install "ArduinoJson@7.4.3"
          arduino-cli lib install "AsyncTimer@2.4.1"
          arduino-cli lib install "MD_MAX72XX@3.5.1"
          arduino-cli lib install "MD_Parola@3.7.5"

      - name: Verify FIRMWARE_VERSION matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          INO_VERSION=$(grep 'FIRMWARE_VERSION' ArduinoWeatherClock.ino \
            | grep -o '"[0-9.]*"' | tr -d '"')
          if [ "$TAG_VERSION" != "$INO_VERSION" ]; then
            echo "Tag v$TAG_VERSION != FIRMWARE_VERSION \"$INO_VERSION\""
            exit 1
          fi

      - name: Build production firmware
        run: make build ARDUINO_CLI=arduino-cli

      - name: Create release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" build/ArduinoWeatherClock.ino.bin \
            --title "$TAG" \
            --notes "See commit log for details"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
